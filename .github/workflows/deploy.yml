name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - id: pages
        uses: actions/configure-pages@v5

      - run: pnpm install --frozen-lockfile

      - name: Check README.md matches content/
        run: |
          pnpm readme
          git diff --exit-code README.md || { echo "::error file=README.md::README.md is out of date. Run 'pnpm readme' and commit the result."; exit 1; }

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Only rendered (encoded) on /card; never committed to the repo.
          CARD_EMAIL: ${{ secrets.CARD_EMAIL }}
          CARD_PHONE: ${{ secrets.CARD_PHONE }}
          NEXT_TELEMETRY_DISABLED: 1

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
